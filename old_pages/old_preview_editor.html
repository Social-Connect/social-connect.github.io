<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialConnect Editor Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #5002b0;
  --bg: #ffffff;
  --text: #111;
}

body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: #e5e7eb;
  overflow: hidden;
}

/* Fullscreen Phone */
.phone-frame {
  position: absolute;
  inset: 0;
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  transition: 0.4s ease;
  z-index: 1;
  overflow: hidden;
}

.phone-content {
  width: 100%;
  max-width: 500px;
  text-align: center;
  padding: 120px 20px;
  z-index: 2;
  position: relative;
}

/* Profile */
.profile-pic {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: #ddd;
  margin: 0 auto 20px;
  background-size: cover;
  background-position: center;
}

#previewName {
  font-weight: 800;
  font-size: 1.4rem;
  margin-bottom: 10px;
}

#previewBio {
  margin-top: -25px;
  margin-bottom: 20px;
  opacity: 0.8;
}

.link-bar {
  background: var(--accent);
  color: white;
  padding: 16px;
  border-radius: 16px;
  margin-bottom: 15px;
  font-weight: 700;
  transition: 0.3s ease;
}

.link-bar:hover {
  transform: scale(1.03);
}

/* Badges */
.badges {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 20px;
}

.badge {
  background: var(--accent);
  color: white;
  padding: 5px 12px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: default;
}

/* Floating Menu */
.floating-menu {
  position: fixed;
  top: 25px;
  left: 25px;
  background: #111;
  border-radius: 50px;
  padding: 14px 30px;
  display: flex;
  gap: 25px;
  align-items: center;
  color: white;
  border: 3px solid var(--accent);
  z-index: 2000;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.floating-menu span {
  cursor: pointer;
  font-size: 1.2rem;
  transition: 0.25s ease;
}

/* Editor Panel */
.editor-panel {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  width: 90%;
  max-width: 500px;
  max-height: 80vh;
  background: #fff;
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s ease, transform 0.3s ease;
  z-index: 2100;
  overflow-y: auto;
}

.editor-panel.active {
  opacity: 1;
  pointer-events: all;
  transform: translateX(-50%) translateY(0);
}

.control-group {
  margin-bottom: 20px;
}

.control-group label {
  font-size: 0.8rem;
  font-weight: 800;
  display: block;
  margin-bottom: 8px;
}

.control-group input, .control-group select, .control-group textarea {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-family: inherit;
}

.add-btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 12px;
  width: 100%;
  border-radius: 12px;
  font-weight: 800;
  cursor: pointer;
}

#editBtn.active {
  color: var(--accent);
  transform: rotate(20deg) scale(1.1);
}

/* Spinner */
@keyframes spin { 
  from { transform: rotate(0deg);} 
  to { transform: rotate(360deg);} 
}

/* Preview Notice Modal */
#previewNotice {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 5000;
}

#previewNoticeContent {
  background: #fff;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  max-width: 400px;
}

#previewNoticeContent button {
  margin-top: 20px;
  padding: 10px 20px;
  border:none;
  background: var(--accent);
  color:white;
  font-weight:700;
  border-radius:12px;
  cursor:pointer;
}
  
  .toggle-wrapper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 0.9rem;
}

.toggle-wrapper label {
  display: flex;
  align-items: center;
  gap: 8px;
}

.switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  background-color: #ccc;
  border-radius: 22px;
  top: 0; left: 0;
  right: 0; bottom: 0;
  transition: 0.3s;
}

.slider::before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 2px;
  bottom: 2px;
  background-color: white;
  border-radius: 50%;
  transition: 0.3s;
}

input:checked + .slider {
  background-color: var(--accent);
}

input:checked + .slider::before {
  transform: translateX(18px);
}

</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loadingScreen" style="position:fixed; inset:0; background:#111; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:3000; color:white;">
  <img src="https://social-connect.github.io/logos/SocialConnect_logo_white.jpg" alt="SocialConnect" style="width:100px; margin-bottom:20px;border-radius: 15px;">
  <div class="spinner" style="width:50px; height:50px; border:6px solid #555; border-top:6px solid var(--accent); border-radius:50%; animation:spin 1s linear infinite;"></div>
  <p style="margin-top:15px;"><center>Loading the SocialConnect editor...</center></p>
</div>

<!-- Preview Notice Modal -->
<div id="previewNotice">
  <div id="previewNoticeContent">
    <h2>Preview Mode</h2>
    <p>This editor is a <strong>preview only</strong>. Changes here <strong>won't work when logged in</strong>. Enjoy customizing!</p>
    <button onclick="closePreviewNotice()">Got it!</button>
  </div>
</div>

<!-- Floating Menu -->
<div class="floating-menu">
  <span onclick="goBack()">←</span>
  <span id="editBtn" onclick="toggleEditor()">✎</span>
</div>

<!-- Editor Panel -->
<div class="editor-panel" id="editorPanel">
  <div class="control-group">
    <label>Display Name</label>
    <input type="text" id="nameInput" placeholder="Your Name">
  </div>
  <div class="control-group">
    <label>Mini Bio (120 characters max)</label>
    <textarea id="bioInput" maxlength="120" rows="3"></textarea>
    <small id="bioCount">0 / 120</small>
  </div>
  <div class="control-group">
    <label>Profile Picture</label>
    <input type="file" id="pfpInput" accept="image/*">
  </div>
  <div class="control-group">
    <label>Accent Color</label>
    <input type="color" id="accentInput" value="#5002b0">
  </div>
  <div class="control-group">
    <label>Text Color</label>
    <input type="color" id="textInput" value="#111111">
  </div>
  <div class="control-group">
    <label>Appearance Theme</label>
    <select id="themeSelect">
      <option value="light">☀️ Light Mode</option>
      <option value="dark">🌙 Dark Mode</option>
      <option value="custom">🎨 Custom</option>
    </select>
  </div>
<!-- Only showing modified/added parts for brevity -->
<div class="control-group" id="customControls" style="display:none;">
  <label>Background Color</label>
  <input type="color" id="bgInput" value="#ffffff">
  
  <label style="margin-top:15px;">Background Upload (Image/Video/GIF)</label>
  <input type="file" id="bgUpload" accept="image/*,video/*,image/gif">
</div>

<hr style="margin:20px 0;">
<h3>Badges</h3>
<div id="badgeControls" class="control-group"></div>
  <div class="control-group">
    <label>Link 1 Label</label>
    <input type="text" id="link1">
  </div>
  <div class="control-group">
    <label>Link 2 Label</label>
    <input type="text" id="link2">
  </div>
  <div class="control-group">
    <label>Link 3 Label</label>
    <input type="text" id="link3">
  </div>

  
  <hr style="margin:20px 0;">
  <h3>Social Media</h3>
  <div id="socialControls"></div>
</div>

<!-- Fullscreen Phone -->
<div class="phone-frame" id="phoneFrame">
  <div class="phone-content">
    <div class="profile-pic" id="profilePic"></div>
    <div id="previewName">Your Name</div>
    <div id="previewBio">Tell us about yourself in ... sentences!</div>
    <div class="badges" id="badgePreview"></div>
    <div id="linksContainer"></div>
    <div id="socialPreview" style="margin-top:20px; display:flex; gap:15px; justify-content:center;"></div>
  </div>
</div>

<script>
/* Core elements */
const panel = document.getElementById("editorPanel");
const nameInput = document.getElementById("nameInput");
const accentInput = document.getElementById("accentInput");
const textInput = document.getElementById("textInput");
const themeSelect = document.getElementById("themeSelect");
const bgInput = document.getElementById("bgInput");
const customControls = document.getElementById("customControls");
const phone = document.getElementById("phoneFrame");
const previewName = document.getElementById("previewName");
const bioInput = document.getElementById("bioInput");
const previewBio = document.getElementById("previewBio");
const bioCount = document.getElementById("bioCount");
const editBtn = document.getElementById("editBtn");
const pfpInput = document.getElementById("pfpInput");
const profilePic = document.getElementById("profilePic");
const bgUpload = document.getElementById("bgUpload");
const linksContainer = document.getElementById("linksContainer");

/* Toggle editor */
function toggleEditor() {
  panel.classList.toggle("active");
  editBtn.classList.toggle("active");
}

/* Go back */
function goBack() { window.location.href = "/"; }

/* Name update */
nameInput.oninput = e => previewName.textContent = e.target.value || "Your Name";

/* Bio update */
bioInput.oninput = e => {
  previewBio.textContent = e.target.value;
  bioCount.textContent = `${e.target.value.length} / 120`;
};

/* Accent */
accentInput.oninput = e => {
  document.documentElement.style.setProperty('--accent', e.target.value);
  document.querySelectorAll('.link-bar').forEach(link => link.style.backgroundColor = e.target.value);
  document.querySelectorAll('.badge').forEach(b => b.style.backgroundColor = e.target.value);
};

/* Text */
textInput.oninput = e => previewName.style.color = e.target.value;

/* Theme */
themeSelect.onchange = e => {
  const val = e.target.value;
  if(val === 'custom') customControls.style.display='block';
  else {
    customControls.style.display='none';
    phone.style.backgroundColor=(val==='dark')?'#111':'#fff';
    previewName.style.color=(val==='dark')?'#fff':'#111';
  }
};

/* Background color */
bgInput.oninput = e => phone.style.backgroundColor = e.target.value;

/* PFP Upload */
pfpInput.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => profilePic.style.backgroundImage = `url(${reader.result})`;
  reader.readAsDataURL(file);
};

/* Background Upload */
bgUpload.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);

  // Remove existing video
  const existing = phone.querySelector('.bg-video');
  if(existing) existing.remove();
  phone.style.backgroundImage='';

  if(file.type.startsWith('video/')) {
    const video = document.createElement('video');
    video.src = url;
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.className='bg-video';
    video.style.position='absolute';
    video.style.inset=0;
    video.style.width='100%';
    video.style.height='100%';
    video.style.objectFit='cover';
    video.style.zIndex=0;
    phone.prepend(video);
  } else {
    phone.style.backgroundImage=`url(${url})`;
    phone.style.backgroundSize='cover';
    phone.style.backgroundPosition='center';
  }
};

/* Links */
const link1 = document.getElementById("link1");
const link2 = document.getElementById("link2");
const link3 = document.getElementById("link3");
function updateLinks(){
  linksContainer.innerHTML="";
  [link1.value, link2.value, link3.value].forEach(text=>{
    if(text.trim()!==""){
      const div=document.createElement("div");
      div.className="link-bar";
      div.textContent=text;
      linksContainer.appendChild(div);
    }
  });
}
link1.oninput=updateLinks;
link2.oninput=updateLinks;
link3.oninput=updateLinks;

/* Badges */
/* BADGES - ICON VERSION WITH ENABLED SWITCH */
const badgePreview = document.getElementById("badgePreview");
const badgeControls = document.getElementById("badgeControls");

const badges = [
  { name: "Verified", icon: "✔️", enabled: true },
  { name: "Pro User", icon: "⭐", enabled: true },
  { name: "Contributor", icon: "🛠️", enabled: true }
];

function updateBadgePreview() {
  badgePreview.innerHTML = "";
  badges.forEach(b => {
    if (b.enabled) {
      const span = document.createElement("span");
      span.className = "badge";
      span.textContent = b.icon;
      badgePreview.appendChild(span);
    }
  });
}

badges.forEach((b, i) => {
  const wrapper = document.createElement("div");
  wrapper.style.marginBottom = "10px";
  wrapper.innerHTML = `
    <label>
      <input type="checkbox" class="badgeToggle" ${b.enabled ? "checked" : ""}>
      ${b.name}
    </label>
    <span style="margin-left:10px;">Preview: ${b.icon}</span>
  `;
  badgeControls.appendChild(wrapper);
});

function updateBadgesFromEditor() {
  const toggles = document.querySelectorAll(".badgeToggle");
  toggles.forEach((toggle, i) => {
    badges[i].enabled = toggle.checked;
  });
  updateBadgePreview();
}

document.addEventListener("input", updateBadgesFromEditor);
document.addEventListener("change", updateBadgesFromEditor);

updateBadgePreview();

/* Socials */
const socialPlatforms = [
  {name:"Instagram", icon:"📷"},
  {name:"Twitter", icon:"🐦"},
  {name:"TikTok", icon:"🎵"},
  {name:"YouTube", icon:"▶️"},
  {name:"Snapchat", icon:"👻"}
];
const socialControls = document.getElementById("socialControls");
const socialPreview = document.getElementById("socialPreview");

socialPlatforms.forEach(platform=>{
  const wrapper=document.createElement("div");
  wrapper.style.marginBottom="10px";
  wrapper.innerHTML=`
    <label>
      <input type="checkbox" class="socialToggle"> ${platform.name}
      <span title="This will NOT redirect to login. It only displays your username." style="cursor:pointer; font-weight:bold;">?</span>
    </label>
    <input type="text" placeholder="${platform.name} username" class="socialInput" style="width:100%; padding:8px; margin-top:5px; border-radius:8px; border:1px solid #ddd;">
  `;
  socialControls.appendChild(wrapper);
});

function updateSocials(){
  socialPreview.innerHTML="";
  const toggles = document.querySelectorAll(".socialToggle");
  const inputs = document.querySelectorAll(".socialInput");
  socialPlatforms.forEach((platform,index)=>{
    if(toggles[index].checked && inputs[index].value.trim()!==""){
      const span = document.createElement("span");
      span.textContent = platform.icon;
      span.style.fontSize="1.5rem";
      socialPreview.appendChild(span);
    }
  });
}

document.addEventListener("input", updateSocials);
document.addEventListener("change", updateSocials);

/* Preview notice */
const previewNotice = document.getElementById("previewNotice");
function closePreviewNotice(){ previewNotice.style.display="none"; }

/* Loading Screen */
let previewClosed = false; // track if user closed the preview

function closePreviewNotice() {
  previewClosed = true;
  previewNotice.style.display = "none";
}

window.addEventListener('load', () => {
  const loader = document.getElementById("loadingScreen");
  const notice = document.getElementById("previewNotice");

  // Ensure loader is on top
  loader.style.zIndex = 5000;
  notice.style.zIndex = 4000;

  const minLoadTime = 3000; // minimum 3 seconds
  const startTime = Date.now();

  // Keep loader visible until at least 3 seconds
  const elapsed = Date.now() - startTime;
  const remaining = Math.max(minLoadTime - elapsed, 0);

  setTimeout(() => {
    loader.style.transition = "opacity 0.5s ease";
    loader.style.opacity = 0;

    loader.addEventListener('transitionend', () => loader.remove());

    // Show preview popup only if it wasn't closed
    if (!previewClosed) {
      notice.style.display = "flex";
      notice.style.opacity = 0;
      notice.style.transition = "opacity 0.5s ease";

      setTimeout(() => {
        if (!previewClosed) notice.style.opacity = 1;
      }, 50);
    }
  }, remaining);
});
</script>
</body>
</html>
